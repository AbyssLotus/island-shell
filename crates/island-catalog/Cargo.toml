[package]
name = "island-catalog"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's signed release catalog: the base installer and every module, checked with minisign."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2"
sha2 = "0.10"
semver = "1"
base64 = "0.22"

[dev-dependencies]
minisign = "0.7"
