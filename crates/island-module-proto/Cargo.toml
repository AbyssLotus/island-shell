[package]
name = "island-module-proto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's module protocol: the manifest, JSON-RPC messages and framing shared by the base and module backends."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
