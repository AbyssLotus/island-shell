[package]
name = "island-win"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Windows helpers shared by Island Shell module backends: Steam's libraries, processes, image thumbnails and windowless launching."

[dependencies]
png = "0.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
