[package]
name = "island-module"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The SDK for Island Shell module backends: the run loop, host messages, DPAPI secrets and an HTTP helper."

[dependencies]
island-module-proto = { path = "../island-module-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Storage_Streams",
  "Web_Http",
  "Web_Http_Filters",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
]
