[package]
name = "island-shell"
version = "0.3.3"
description = "A morphing top island shell for Windows"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
arboard = "3.6"
# The signed release catalog: the updater (and later the module installer) reads it.
island-catalog = { path = "../crates/island-catalog" }
# Runs module backends (crates/island-host) and speaks their protocol.
island-host = { path = "../crates/island-host" }
# Image thumbnails with Windows' decoder (Steam covers), shared with the modules.
island-win = { path = "../crates/island-win" }
# Same versions Tauri uses, for WebView2 calls Tauri doesn't wrap (memory usage target).
webview2-com = "0.39"
windows-core-wv = { package = "windows-core", version = "0.62" }
# The `windows` crate's own core, which its #[interface] macro refers to by name.
windows-core = "0.61"
# The `windows` crate's async types (progress handlers), which it doesn't re-export.
windows-future = "0.2"

[dependencies.windows]
version = "0.61"
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Management_Deployment",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Devices_Radios",
