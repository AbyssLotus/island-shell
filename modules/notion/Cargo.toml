[package]
name = "notion-module"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's Notion module: to-dos from Notion databases in Today, and dated pages in the calendar."

[[bin]]
name = "notion-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
