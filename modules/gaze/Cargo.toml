[package]
name = "gaze-module"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's eye tracking module: a Tobii tracker's presence and where your eyes are, for the island (look at it to peek) and the Music module (pause when you step away)."

[[bin]]
name = "gaze-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
]
