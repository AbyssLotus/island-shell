[package]
name = "music-module"
version = "1.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's Music module: what's playing in any player Windows knows (Apple Music gets its whole player bar), time-synced lyrics, the Music tab and sheet."

[[bin]]
name = "music-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
island-win = { path = "../../crates/island-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
]
