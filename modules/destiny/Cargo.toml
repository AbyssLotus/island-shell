[package]
name = "destiny-module"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's Destiny 2 module: Guardians, loadouts, Xûr and the resets, through Bungie's API with your own key."

[[bin]]
name = "destiny-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
