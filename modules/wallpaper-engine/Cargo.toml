[package]
name = "wallpaper-engine-module"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's Wallpaper Engine module: your wallpapers in the Wallpaper tab, applied, paused and muted through Wallpaper Engine itself."

[[bin]]
name = "wallpaper-engine-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
island-win = { path = "../../crates/island-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
