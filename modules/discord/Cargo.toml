[package]
name = "discord-module"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's Discord module: your call on the island, @mentions as notifications and Apple Music on your status, through the Discord app's local RPC pipe."

[[bin]]
name = "discord-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
island-win = { path = "../../crates/island-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
]
