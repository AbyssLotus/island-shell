[package]
name = "transit-module"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Island Shell's Transit module: live departures from any city's GTFS and GTFS-realtime feeds, with Philadelphia (SEPTA) built in."

[[bin]]
name = "transit-module"
path = "src/main.rs"

[dependencies]
island-module = { path = "../../crates/island-module" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
