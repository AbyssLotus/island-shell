# Reproducible Windows builds: link.exe stamps the build time into every program unless told not
# to (/Brepro), which made a module whose code hadn't changed come out different in each release.
# pack-modules now judges a module by its own source, not its exe, so that no longer fails a
# release, but the same inputs still make the same program.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/Brepro"]
